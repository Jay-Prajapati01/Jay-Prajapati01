name: Generate Snake Animation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Jay-Prajapati01
          outputs: |
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#09090B,#1a1a2e,#22D3EE,#10B981
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#FFFFFF,#E2E8F0,#0891B2,#059669
          
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          destination_dir: .
          keep_files: true
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update snake animation [skip ci]'
