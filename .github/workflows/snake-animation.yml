name: Generate Snake Animation

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Jay-Prajapati01
          outputs: |
            dist/github-snake.svg?color_snake=#22D3EE&color_dots=#09090B,#1a1a2e,#22D3EE,#10B981
            dist/github-snake-dark.svg?color_snake=#22D3EE&color_dots=#09090B,#1a1a2e,#22D3EE,#10B981
          
      - name: Upload snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
