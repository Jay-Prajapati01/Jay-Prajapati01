name: Generate Snake Animation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: output
          fetch-depth: 0
        
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Jay-Prajapati01
          outputs: |
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#09090B,#1a1a2e,#22D3EE,#10B981
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#FFFFFF,#E2E8F0,#0891B2,#059669
          
      - name: Copy SVGs to output branch root
        run: |
          cp dist/snake-dark.svg .
          cp dist/snake-light.svg .
          
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git diff --cached --quiet || git commit -m "chore: update snake animation [skip ci]"
          git push
