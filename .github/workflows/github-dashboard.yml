name: GitHub Dashboard Generator

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Contribution Streak SVG
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-streak.js

      - name: Generate Engineering Stats SVG
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-engineering-stats.js

      - name: Generate Language Stats SVG
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-language-stats.js

      - name: Check for changes
        id: changes
        run: |
          changed=false
          git diff --quiet assets/contribution-streak.svg || changed=true
          git diff --quiet assets/engineering-stats.svg   || changed=true
          git diff --quiet assets/top-languages.svg       || changed=true
          echo "changed=$changed" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-streak.svg assets/engineering-stats.svg assets/top-languages.svg
          git commit -m "chore: update stats SVGs [skip ci]"
          git push
