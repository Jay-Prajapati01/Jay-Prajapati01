<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 413" width="100%" height="100%" preserveAspectRatio="xMinYMin slice">
  <defs>
    <style>
      @font-face { font-family: 'JetBrains Mono'; src: local('JetBrains Mono'), local('IBM Plex Mono'), local('Fira Code'), local('SF Mono'), local('Menlo'); }
      text { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', 'SF Mono', 'Menlo', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="732" height="413" fill="#09090B"/>

  <!-- Border -->
  <rect x="0" y="0" width="732" height="413" rx="10" fill="none" stroke="#22D3EE" stroke-width="1.5"/>

  <!-- Terminal Header -->
  <rect width="732" height="36" fill="#0F172A"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5" fill="#27c93f"/>

  <!-- Title -->
  <text x="366" y="22" text-anchor="middle" font-size="12" fill="#94A3B8" letter-spacing="0.5">./profile.sh --live</text>

  <!-- LIVE indicator -->
  <circle cx="692" cy="18" r="4" fill="#10B981"/>
  <text x="702" y="22" font-size="10" fill="#10B981" letter-spacing="1">LIVE</text>

  <!-- Header separator -->
  <line x1="0" y1="36" x2="732" y2="36" stroke="#334155" stroke-width="0.5"/>

  <!-- PERSONAL.INFO Section -->
  <text x="32" y="68" font-size="14" fill="#22D3EE" font-weight="700" letter-spacing="1.5">PERSONAL.INFO</text>

  <!-- Name -->
  <text x="32" y="98" font-size="12" fill="#94A3B8">Name</text>
  <text x="160" y="98" font-size="13" fill="#F8FAFC">Jay Prajapati</text>

  <!-- Role -->
  <text x="32" y="124" font-size="12" fill="#94A3B8">Role</text>
  <text x="160" y="124" font-size="13" fill="#F8FAFC">AI Engineer | Full-Stack Developer</text>

  <!-- Location -->
  <text x="32" y="150" font-size="12" fill="#94A3B8">Location</text>
  <text x="160" y="150" font-size="13" fill="#F8FAFC">Ahmedabad, India</text>

  <!-- Status -->
  <text x="32" y="176" font-size="12" fill="#94A3B8">Status</text>
  <text x="160" y="176" font-size="13" fill="#10B981">Building AI Products</text>

  <!-- Focus -->
  <text x="32" y="202" font-size="12" fill="#94A3B8">Focus</text>
  <text x="160" y="202" font-size="13" fill="#F8FAFC">Intelligent Systems &amp; Automation</text>

  <!-- Separator -->
  <line x1="32" y1="222" x2="700" y2="222" stroke="#334155" stroke-width="0.5"/>

  <!-- ENGINEERING Section -->
  <text x="32" y="252" font-size="14" fill="#22D3EE" font-weight="700" letter-spacing="1.5">ENGINEERING</text>

  <!-- Languages -->
  <text x="32" y="282" font-size="12" fill="#94A3B8">Languages</text>
  <text x="160" y="282" font-size="13" fill="#F8FAFC">C++ | Python | TypeScript</text>

  <!-- Frameworks -->
  <text x="32" y="308" font-size="12" fill="#94A3B8">Frameworks</text>
  <text x="160" y="308" font-size="13" fill="#F8FAFC">Next.js | React | Tailwind CSS</text>

  <!-- Backend -->
  <text x="32" y="334" font-size="12" fill="#94A3B8">Backend</text>
  <text x="160" y="334" font-size="13" fill="#F8FAFC">FastAPI | Node.js | Express.js</text>

  <!-- Database -->
  <text x="32" y="360" font-size="12" fill="#94A3B8">Database</text>
  <text x="160" y="360" font-size="13" fill="#F8FAFC">PostgreSQL | MongoDB | Redis | Qdrant</text>

  <!-- AI Stack -->
  <text x="32" y="386" font-size="12" fill="#94A3B8">AI Stack</text>
  <text x="160" y="386" font-size="13" fill="#F8FAFC">Ollama | RAG | LangChain | OpenCV</text>

  <!-- Cloud -->
  <text x="32" y="412" font-size="12" fill="#94A3B8">Cloud</text>
  <text x="160" y="412" font-size="13" fill="#F8FAFC">Docker | AWS | Cloudflare | Vercel</text>

</svg>
